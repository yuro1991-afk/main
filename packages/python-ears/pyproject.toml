[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-ears"
version = "0.1.0"
description = "Hearing organ for Genesis head and mind."
requires-python = ">=3.11"
authors = [{ name = "Yuri" }]
dependencies = ["genesis-infra"]

[project.scripts]
genesis-ears = "genesis_ears.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
