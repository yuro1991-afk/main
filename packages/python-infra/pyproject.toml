[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-infra"
version = "0.1.0"
description = "Shared Python handshake for the Genesis lattice."
requires-python = ">=3.11"
authors = [{ name = "Yuri" }]

[project.scripts]
genesis-infra = "genesis_infra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
