[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-head"
version = "0.1.0"
description = "Cranium think-act-observe loop for the Genesis seat."
requires-python = ">=3.11"
authors = [{ name = "Yuri" }]
dependencies = ["genesis-infra", "genesis-python-mind"]

[project.scripts]
genesis-head = "genesis_head.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
