[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-python-mind"
version = "0.1.0"
description = "Inner cognitive loop for a Genesis roster agent."
requires-python = ">=3.11"
authors = [{ name = "Yuri" }]
dependencies = ["genesis-infra"]

[project.scripts]
genesis-python-mind = "genesis_mind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
