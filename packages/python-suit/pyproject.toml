[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-suit"
version = "0.1.0"
description = "Python bodies for the six Genesis hub heads."
requires-python = ">=3.11"
authors = [{ name = "Yuri" }]
dependencies = ["genesis-infra"]

[project.scripts]
genesis-suit = "genesis_suit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
